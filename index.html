
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>DROPZONE — NFT Simulator</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090b12;
  --panel: #131827;
  --line: #293149;
  --purple: #9364ff;
  --blue: #6cbcff;
  --text: #f4f5ff;
  --muted: #929bb5;
  --green: #59e6a0;
  --red: #ff647c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px Arial, sans-serif;
}
button, input { font: inherit; }
button {
  border: 0;
  cursor: pointer;
  border-radius: 10px;
  padding: 12px 16px;
  background: var(--purple);
  color: white;
  font-weight: 700;
}
button:disabled { opacity: .5; cursor: wait; }
button.secondary { background: #242c40; }
button.danger { background: #9f3049; }
header {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px max(16px, calc((100% - 1100px)/2));
  background: #0d101bed;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.logo { font-size: 23px; font-weight: 900; letter-spacing: 2px; }
.logo span { color: var(--purple); }
.balance {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 14px;
}
main { max-width: 1100px; margin: auto; padding: 22px 16px 60px; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
nav button { background: #171d2b; border: 1px solid var(--line); }
nav button.active { background: #493181; border-color: var(--purple); }
h1 { font-size: clamp(26px, 5vw, 40px); margin: 12px 0; }
h2 { margin-top: 28px; }
p, .muted { color: var(--muted); line-height: 1.55; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 14px;
}
.card {
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: linear-gradient(145deg, #171d2c, #101420);
}
.card .emoji { font-size: 48px; margin: 12px 0; }
.card h3 { margin: 8px 0; overflow-wrap: anywhere; }
.card .price { font-size: 20px; font-weight: 800; margin: 12px 0; }
.card button { width: 100%; margin-top: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pill {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #28223e;
  color: #cbbaff;
  font-size: 12px;
}
.empty {
  padding: 35px 15px;
  text-align: center;
  border: 1px dashed #39415a;
  border-radius: 14px;
  color: var(--muted);
}
#notice {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: max-content;
  max-width: calc(100% - 28px);
  padding: 13px 18px;
  background: #252d40;
  border: 1px solid #48516b;
  border-radius: 12px;
  box-shadow: 0 8px 35px #0008;
  display: none;
}
#modal {
  position: fixed;
  inset: 0;
  z-index: 8;
  display: none;
  place-items: center;
  padding: 14px;
  background: #05070ded;
}
#modal.show { display: grid; }
.modalbox {
  width: min(700px, 100%);
  min-width: 0;
  max-height: 90dvh;
  overflow: auto;
  padding: clamp(15px, 4vw, 26px);
  border: 1px solid #514276;
  border-radius: 20px;
  background: var(--panel);
  text-align: center;
}
.reel {
  width: 100%;
  min-width: 0;
  height: 135px;
  overflow: hidden;
  position: relative;
  border: 1px solid #514276;
  border-radius: 12px;
  background: #080b12;
  margin: 22px 0;
  isolation: isolate;
}
.reel::after {
  content: "";
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 3px;
  transform: translateX(-50%);
  background: #ffd477;
  box-shadow: 0 0 12px #ffd477;
  pointer-events: none;
}
.track {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  display: flex;
  align-items: stretch;
  gap: 8px;
  width: max-content;
  padding: 8px;
  will-change: transform;
}
.reelitem {
  flex: 0 0 105px;
  height: 100%;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 5px;
  background: #171d2b;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.reelitem .emoji { font-size: 32px; }
.reelitem small { color: var(--muted); font-size: 10px; }
.field {
  display: grid;
  gap: 8px;
  text-align: left;
  margin: 14px 0;
}
.field input {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--line);
  background: #090d17;
  border-radius: 10px;
  color: white;
}
footer { padding-top: 25px; text-align: center; color: var(--muted); font-size: 12px; }
@media(max-width: 480px) {
  header { padding: 12px; }
  .logo { font-size: 19px; }
  .balance { padding: 9px; font-size: 13px; }
  main { padding: 16px 12px 40px; }
  .reelitem { flex-basis: 86px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">DROP<span>ZONE</span></div>
  <div class="balance">Баланс: <strong id="balance">—</strong></div>
</header>

<main>
  <div id="auth">
    <h1>добро пожаловать в DROPZONE</h1>
    <p>войди в аккаунт или создай новый, чтобы открыть магазин</p>
    <div class="card" style="max-width:430px">
      <div class="field">
        <label for="authName">Имя пользователя</label>
        <input id="authName" autocomplete="username" maxlength="32" placeholder="твой логин">
      </div>
      <div class="field">
        <label for="authPassword">Пароль</label>
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="твой пароль">
      </div>
      <div class="row">
        <button id="loginBtn" type="button">Войти</button>
        <button id="registerBtn" class="secondary" type="button">Регистрация</button>
      </div>
    </div>
  </div>

  <section id="app" hidden>
    <nav>
      <button data-page="cases" class="active">Кейсы</button>
      <button data-page="inventory">Инвентарь</button>
      <button data-page="market">Рынок</button>
      <button data-page="profile">Профиль</button>
      <button id="logoutBtn" class="secondary">Выйти</button>
    </nav>
    <div id="content"></div>
  </section>
  <footer>DROPZONE · виртуальные предметы · цены указаны в игровых монетах</footer>
</main>

<div id="notice" role="status"></div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modalbox">
    <h2 id="modalTitle">Открытие кейса</h2>
    <p id="modalText">выбираем предмет</p>
    <div class="reel" id="reel">
      <div class="track" id="track"></div>
    </div>
    <h2 id="winnerName"></h2>
    <p id="winnerPrice"></p>
    <div class="row" style="justify-content:center">
      <button id="claimBtn" hidden>Забрать предмет</button>
      <button id="closeModalBtn" class="secondary">Закрыть</button>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = (selector) => document.querySelector(selector);

const state = {
  user: null,
  items: [],
  cases: [],
  page: "cases",
  busy: false,
  spinning: false,
  pendingWinner: null,
  timer: null
};

function money(value) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.floor(n).toLocaleString("ru-RU") : "0";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function notify(message) {
  const box = $("#notice");
  box.textContent = message;
  box.style.display = "block";
  clearTimeout(state.timer);
  state.timer = setTimeout(() => box.style.display = "none", 3500);
}

async function api(action, data = {}) {
  const aliases = {
    open_case: "open-case",
    sell_item: "sell-item",
    buy_item: "buy-item"
  };
  const serverAction = aliases[action] || action;
  const method = action === "state" ? "GET" : "POST";
  const url = `/.netlify/functions/game?action=${encodeURIComponent(serverAction)}`;

  const response = await fetch(url, {
    method,
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Accept": "application/json",
      ...(method === "POST" ? {
        "Content-Type": "application/json"
      } : {})
    },
    ...(method === "POST" ? { body: JSON.stringify(data) } : {})
  });

  const body = await response.json().catch(() => ({}));

  if (!response.ok || body.error) {
    throw new Error(body.error || `Ошибка сервера: ${response.status}`);
  }
  return body;
}

function normalizeUser(user) {
  if (!user) return null;
  return {
    ...user,
    balance: Number(user.balance) || 0,
    inventory: Array.isArray(user.inventory) ? user.inventory : []
  };
}

async function refresh({quiet = false} = {}) {
  const result = await api("state");
  if (result.user) state.user = normalizeUser(result.user);
  if (Array.isArray(result.items)) state.items = result.items;
  if (Array.isArray(result.cases)) state.cases = result.cases;

  $("#balance").textContent = state.user ? money(state.user.balance) : "—";
  $("#auth").hidden = !!state.user;
  $("#app").hidden = !state.user;

  if (state.user && !state.spinning) render();
  return result;
}

function itemFor(id) {
  return state.items.find(item => String(item.id) === String(id));
}

function itemEmoji(item) {
  return item?.emoji || item?.icon || "🎁";
}

function showEmpty(message) {
  return `<div class="empty">${escapeHTML(message)}</div>`;
}

function renderCases() {
  $("#content").innerHTML = `
    <h1>кейсы</h1>
    <p>выбирай кейс и получай виртуальные предметы</p>
    <div class="grid" id="caseGrid"></div>
  `;

  const grid = $("#caseGrid");
  if (!state.cases.length) {
    grid.innerHTML = showEmpty("сейчас кейсов нет");
    return;
  }

  grid.innerHTML = state.cases.map(c => `
    <article class="card">
      <div class="emoji">${escapeHTML(c.emoji || "📦")}</div>
      <span class="pill">DROPZONE CASE</span>
      <h3>${escapeHTML(c.name || "Кейс")}</h3>
      <p>${escapeHTML(c.description || "виртуальные предметы")}</p>
      <div class="price">${money(c.price)} монет</div>
      <button data-open-case="${escapeHTML(c.id)}">Открыть кейс</button>
    </article>
  `).join("");
}

function renderInventory() {
  $("#content").innerHTML = `
    <h1>инвентарь</h1>
    <p>твои предметы и их текущая стоимость</p>
    <div class="grid" id="inventoryGrid"></div>
  `;

  const grid = $("#inventoryGrid");
  const inventory = state.user?.inventory || [];

  if (!inventory.length) {
    grid.innerHTML = showEmpty("инвентарь пустой — открой кейс");
    return;
  }

  grid.innerHTML = inventory.map((id, index) => {
    const item = itemFor(id);
    if (!item) {
      return `<article class="card">
        <div class="emoji">🎁</div>
        <h3>Предмет #${index + 1}</h3>
        <p>данные предмета недоступны</p>
      </article>`;
    }

    return `<article class="card">
      <div class="emoji">${escapeHTML(itemEmoji(item))}</div>
      <h3>${escapeHTML(item.name || "Предмет")}</h3>
      <span class="pill">В инвентаре</span>
      <div class="price">${money(item.price)} монет</div>
      <button data-sell="${index}">Продать за ${money(Math.floor((Number(item.price) || 0) * .6))}</button>
    </article>`;
  }).join("");
}

function renderMarket() {
  $("#content").innerHTML = `
    <h1>рынок</h1>
    <p>текущие цены виртуальных предметов</p>
    <div class="grid" id="marketGrid"></div>
  `;

  const grid = $("#marketGrid");
  if (!state.items.length) {
    grid.innerHTML = showEmpty("предметов пока нет");
    return;
  }

  grid.innerHTML = state.items.map(item => `
    <article class="card">
      <div class="emoji">${escapeHTML(itemEmoji(item))}</div>
      <h3>${escapeHTML(item.name || "Предмет")}</h3>
      <div class="price">${money(item.price)} монет</div>
      <p>цена обновляется сервером</p>
    </article>
  `).join("");
}

function renderProfile() {
  const user = state.user || {};
  $("#content").innerHTML = `
    <h1>профиль</h1>
    <div class="card">
      <p>игрок</p>
      <h2>${escapeHTML(user.username || user.name || "Игрок")}</h2>
      <p>баланс: <strong>${money(user.balance)} монет</strong></p>
      <p>предметов: <strong>${(user.inventory || []).length}</strong></p>
      <button id="profileRefresh" class="secondary">Обновить данные</button>
    </div>
  `;
}

function render() {
  if (!state.user) return;

  document.querySelectorAll("nav [data-page]").forEach(button => {
    button.classList.toggle("active", button.dataset.page === state.page);
  });

  if (state.page === "inventory") renderInventory();
  else if (state.page === "market") renderMarket();
  else if (state.page === "profile") renderProfile();
  else renderCases();
}

async function runAction(action, data) {
  if (state.busy) return null;
  state.busy = true;

  try {
    return await api(action, data);
  } catch (error) {
    notify(error.message || "что-то пошло не так");
    return null;
  } finally {
    state.busy = false;
  }
}

async function login(register) {
  const username = $("#authName").value.trim();
  const password = $("#authPassword").value;

  if (!username || !password) {
    notify("введи логин и пароль");
    return;
  }

  const result = await runAction(register ? "register" : "login", {
    username, password
  });

  if (!result) return;

  try {
    await refresh();
    notify(register ? "аккаунт создан" : "ты вошёл в аккаунт");
  } catch (error) {
    notify(error.message || "не удалось загрузить данные");
  }
}

function closeModal() {
  if (state.spinning) return;
  $("#modal").classList.remove("show");
  state.pendingWinner = null;
}

function makeTile(item) {
  const tile = document.createElement("div");
  tile.className = "reelitem";

  const emoji = document.createElement("div");
  emoji.className = "emoji";
  emoji.textContent = itemEmoji(item);

  const name = document.createElement("small");
  name.textContent = item?.name || "Предмет";

  tile.append(emoji, name);
  return tile;
}

async function openCase(caseId) {
  if (state.busy || state.spinning) return;

  const chosenCase = state.cases.find(c => String(c.id) === String(caseId));
  if (!chosenCase) {
    notify("этот кейс больше недоступен");
    return;
  }

  state.busy = true;
  state.spinning = true;
  state.pendingWinner = null;

  $("#modal").classList.add("show");
  $("#modalTitle").textContent = chosenCase.name || "Открытие кейса";
  $("#modalText").textContent = "получаем результат с сервера...";
  $("#winnerName").textContent = "";
  $("#winnerPrice").textContent = "";
  $("#claimBtn").hidden = true;
  $("#closeModalBtn").disabled = true;

  const track = $("#track");
  track.replaceChildren();
  track.style.transition = "none";
  track.style.transform = "translateX(0px)";

  try {
    const result = await api("open_case", { case_id: chosenCase.id });
    const winnerId = result.item?.id ?? result.itemId ?? result.item_id;
    const winner = result.item || itemFor(winnerId);

    if (!winner) {
      await refresh({quiet: true});
      throw new Error("сервер не вернул выигранный предмет");
    }

    const pool = state.items.length ? state.items : [winner];
    const tiles = [];

    for (let i = 0; i < 45; i++) {
      const item = i === 38 ? winner : pool[Math.floor(Math.random() * pool.length)];
      const tile = makeTile(item);
      track.appendChild(tile);
      tiles.push(tile);
    }

    await new Promise(resolve => requestAnimationFrame(() =>
      requestAnimationFrame(resolve)
    ));

    const reel = $("#reel");
    const winningTile = tiles[38];
    const reelRect = reel.getBoundingClientRect();
    const tileRect = winningTile.getBoundingClientRect();

    const delta = tileRect.left + tileRect.width / 2
      - (reelRect.left + reelRect.width / 2);

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";
    void track.offsetWidth;

    track.style.transition = "transform 4.5s cubic-bezier(.08,.72,.08,1)";
    track.style.transform = `translateX(${-delta}px)`;

    $("#modalText").textContent = "кейс открывается...";
    await new Promise(resolve => {
      track.addEventListener("transitionend", resolve, {once: true});
      setTimeout(resolve, 5200);
    });

    state.pendingWinner = winner;
    $("#modalTitle").textContent = "предмет получен";
    $("#modalText").textContent = "предмет уже добавлен на сервере";
    $("#winnerName").textContent = winner.name || "Предмет";
    $("#winnerPrice").textContent = `${money(winner.price)} монет`;
    $("#claimBtn").hidden = false;
    $("#closeModalBtn").disabled = false;

    await refresh({quiet: true});
  } catch (error) {
    $("#modalTitle").textContent = "ошибка";
    $("#modalText").textContent = error.message || "не удалось открыть кейс";
    $("#closeModalBtn").disabled = false;
    notify(error.message || "не удалось открыть кейс");
  } finally {
    state.busy = false;
    state.spinning = false;
  }
}

async function sellItem(index) {
  if (state.busy) return;

  const inventory = state.user?.inventory || [];
  if (index < 0 || index >= inventory.length) {
    notify("предмет уже отсутствует в инвентаре");
    await refresh({quiet: true});
    return;
  }

  const result = await runAction("sell_item", { inventory_id: index });
  if (!result) {
    try { await refresh({quiet: true}); } catch {}
    return;
  }

  try {
    await refresh({quiet: true});
    state.page = "inventory";
    render();
    notify(`предмет продан · +${money(result.payout)} монет`);
  } catch (error) {
    notify("продажа выполнена, но данные не обновились: " + error.message);
  }
}

document.querySelectorAll("nav [data-page]").forEach(button => {
  button.addEventListener("click", () => {
    state.page = button.dataset.page;
    render();
  });
});

$("#loginBtn").addEventListener("click", () => login(false));
$("#registerBtn").addEventListener("click", () => login(true));
$("#logoutBtn").addEventListener("click", async () => {
  await runAction("logout");
  state.user = null;
  state.items = [];
  state.cases = [];
  $("#auth").hidden = false;
  $("#app").hidden = true;
});

$("#content").addEventListener("click", async event => {
  const openButton = event.target.closest("[data-open-case]");
  if (openButton) {
    await openCase(openButton.dataset.openCase);
    return;
  }

  const sellButton = event.target.closest("[data-sell]");
  if (sellButton) {
    await sellItem(Number(sellButton.dataset.sell));
    return;
  }

  if (event.target.closest("#profileRefresh")) {
    try {
      await refresh();
      notify("данные обновлены");
    } catch (error) {
      notify(error.message || "не удалось обновить данные");
    }
  }
});

$("#claimBtn").addEventListener("click", async () => {
  if (!state.pendingWinner) return;
  $("#modal").classList.remove("show");
  state.pendingWinner = null;
  state.page = "inventory";

  try {
    await refresh({quiet: true});
    render();
  } catch (error) {
    notify(error.message || "не удалось обновить инвентарь");
  }
});

$("#closeModalBtn").addEventListener("click", closeModal);

$("#modal").addEventListener("click", event => {
  if (event.target === $("#modal")) closeModal();
});

document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && state.user && !state.busy && !state.spinning) {
    try { await refresh({quiet: true}); } catch {}
  }
});

async function boot() {
  try {
    await refresh();
  } catch {
    $("#balance").textContent = "—";
    $("#auth").hidden = false;
    $("#app").hidden = true;
    notify("не удалось загрузить сайт. проверь подключение к серверу");
  }

  setInterval(async () => {
    if (document.hidden || !state.user || state.busy || state.spinning) return;

    try {
      const before = JSON.stringify({
        balance: state.user?.balance,
        inventory: state.user?.inventory,
        items: state.items,
        cases: state.cases
      });

      await refresh({quiet: true});

      const after = JSON.stringify({
        balance: state.user?.balance,
        inventory: state.user?.inventory,
        items: state.items,
        cases: state.cases
      });

      if (before !== after) render();
    } catch {
      // временная ошибка сети не должна ломать интерфейс
    }
  }, 7000);
}

boot();
</script>
</body>
</html>
